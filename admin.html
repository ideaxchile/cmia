<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · CMIA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --tinta: #1d1d1b; --gris: #5f6368; --linea: #d6d3cc; --suave: #f4f2ed; --azul: #1f3b63; --burdeo: #7a1f35; --bien: #2e5e3a; --bad: #9b1c1c; --serif: "IBM Plex Serif", Georgia, serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--tinta); font: 15px/1.55 "IBM Plex Sans", Arial, sans-serif; }
  a { color: var(--azul); }
  .hidden { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 420px; border-top: 2px solid var(--tinta); padding-top: 22px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca b { font: 500 18px/1.2 var(--serif); }
  .marca small { display: block; font-size: 12.5px; color: var(--gris); }
  .login h1 { font: 500 24px var(--serif); margin: 24px 0 4px; }

  .top { border-bottom: 1px solid var(--linea); }
  .top-in { max-width: 1120px; margin: 0 auto; padding: 14px 24px 0; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .top-in .marca { margin-right: auto; }
  .top-in .cuenta { font-size: 13px; color: var(--gris); }
  .tabs { max-width: 1120px; margin: 10px auto 0; padding: 0 24px; display: flex; gap: 24px; flex-wrap: wrap; border-top: 2px solid var(--tinta); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; cursor: pointer; font-size: 14.5px; margin-bottom: -1px; }
  .tabs button[aria-pressed="true"] { border-bottom-color: var(--burdeo); font-weight: 600; }
  .tabs button:hover { color: var(--burdeo); }
  .main { max-width: 1120px; margin: 0 auto; padding: 26px 24px 70px; }

  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .head h2 { font: 500 24px/1.25 var(--serif); margin: 0; }
  .sub { color: var(--gris); margin: 4px 0 0; }
  .hint { color: var(--gris); font-size: 13px; }
  .filters { display: none; }

  .btn { display: inline-block; border: 1px solid var(--azul); background: #fff; color: var(--azul); padding: 8px 16px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 2px; }
  .btn:hover { background: var(--azul); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-p { background: var(--azul); color: #fff; }
  .btn-p:hover { background: #142a49; }
  .btn-d { border-color: var(--bad); color: var(--bad); }
  .btn-d:hover { background: var(--bad); color: #fff; }
  .btn-sm { padding: 5px 11px; font-size: 13px; }

  .list { border-top: 1px solid var(--linea); }
  .row { display: flex; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--linea); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font: 500 16.5px/1.35 var(--serif); }
  .row-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--gris); margin-top: 3px; }
  .row-actions { display: flex; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .thumb { width: 46px; aspect-ratio: 1 / 1.414; object-fit: cover; border: 1px solid var(--linea); background: var(--suave); flex: none; }
  .et { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
  .et.ok { color: var(--bien); }
  .et.alerta { color: var(--burdeo); }
  .empty { padding: 30px 0; color: var(--gris); border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }

  .field { display: block; margin: 0 0 14px; font-weight: 500; font-size: 14px; }
  .field input, .field select, .field textarea { display: block; width: 100%; margin-top: 5px; padding: 8px 10px; border: 1px solid #b9b5ab; border-radius: 2px; background: #fff; font-weight: 400; font-size: 15px; }
  .field textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul); }
  .field .hint { display: block; font-weight: 400; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .agenda { margin-top: 30px; padding-top: 14px; border-top: 2px solid var(--tinta); }
  .agenda h3 { font: 600 12.5px "IBM Plex Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  code { font-family: ui-monospace, Menlo, monospace; }

  .drawer-bg { position: fixed; inset: 0; background: rgba(29, 29, 27, .45); display: flex; justify-content: flex-end; z-index: 20; }
  .drawer { width: 100%; max-width: 720px; height: 100%; background: #fff; display: flex; flex-direction: column; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 2px solid var(--tinta); }
  .drawer-head h3 { margin: 0; font: 500 20px var(--serif); }
  .drawer-body { flex: 1; overflow: auto; padding: 20px 24px; }
  .drawer-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--linea); }

  .upload { border: 1px solid var(--linea); padding: 12px 14px; margin: 0 0 14px; }
  .upload-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .picker { position: relative; overflow: hidden; }
  .picker input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .preview { background: var(--suave); display: flex; align-items: center; justify-content: center; color: var(--gris); font-size: 13px; overflow: hidden; margin-bottom: 8px; max-width: 220px; }
  .preview img { width: 100%; height: 100%; object-fit: cover; }
  .pdfline { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--gris); }
  .estado { border: 1px solid var(--linea); padding: 12px 14px; margin: 0 0 14px; }
  .estado-t { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .estado-op { display: flex; gap: 22px; flex-wrap: wrap; }
  .estado-op label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .au-fila { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 6px; padding: 8px 0; border-bottom: 1px dotted var(--linea); }
  .au-fila input { padding: 7px 8px; border: 1px solid #b9b5ab; border-radius: 2px; min-width: 0; font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 11px 18px; font-size: 14px; z-index: 50; max-width: 90vw; border-radius: 2px; }
  .toast.err { background: var(--bad); }

  @media (max-width: 720px) {
    .grid2 { grid-template-columns: 1fr; }
    .row { flex-wrap: wrap; }
    .row-actions { width: 100%; justify-content: flex-start; }
    .au-fila { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<section class="login" id="vLogin">
  <div class="login-box">
    <div class="marca"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" style="flex:none"><path d="M83.10 24.14A42 42 0 1 0 50 92L95 87.5" fill="none" stroke="#1f3b63" stroke-width="9.5" stroke-linejoin="round"/><path d="M72.46 32.45A28.5 28.5 0 1 0 50 78.5L95 75.5" fill="none" stroke="#7a1f35" stroke-width="9.5" stroke-linejoin="round"/><path d="M61.82 40.77A15 15 0 1 0 50 65L95 63.5" fill="none" stroke="#b08a2e" stroke-width="9.5" stroke-linejoin="round"/></svg><div><b>Cuaderno Multidisciplinar de Investigación Aplicada</b><small>CMIA · IDEAX Chile</small></div></div>
    <h1>Panel editorial</h1>
    <p class="sub" id="loginMsg" role="status">Entra con tu cuenta de Google autorizada.</p>
    <div id="gBtn" style="margin-top:20px;min-height:44px"></div>
    <p class="hint" style="margin-top:22px">Solo las cuentas autorizadas pueden administrar la revista. <a href="./">Volver a la revista</a></p>
  </div>
</section>

<div id="vApp" class="hidden">
  <header class="top">
    <div class="top-in">
      <div class="marca"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" style="flex:none"><path d="M83.10 24.14A42 42 0 1 0 50 92L95 87.5" fill="none" stroke="#1f3b63" stroke-width="9.5" stroke-linejoin="round"/><path d="M72.46 32.45A28.5 28.5 0 1 0 50 78.5L95 75.5" fill="none" stroke="#7a1f35" stroke-width="9.5" stroke-linejoin="round"/><path d="M61.82 40.77A15 15 0 1 0 50 65L95 63.5" fill="none" stroke="#b08a2e" stroke-width="9.5" stroke-linejoin="round"/></svg><div><b>CMIA · Panel editorial</b><small>Revista editada por IDEAX Chile</small></div></div>
      <span class="cuenta" id="cuenta"></span>
      <a class="btn btn-sm" href="./" target="_blank">Ver la revista</a>
      <button class="btn btn-sm" id="salir" type="button">Cerrar sesión</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones del panel"></nav>
  </header>
  <main class="main" id="vista"></main>
</div>

<div class="drawer-bg hidden" id="editor" role="dialog" aria-modal="true" aria-labelledby="edTitulo">
  <form class="drawer" id="edForm">
    <div class="drawer-head"><h3 id="edTitulo">Editar</h3><button type="button" class="btn btn-sm" id="edCerrar">Cerrar</button></div>
    <div class="drawer-body" id="edBody"></div>
    <div class="drawer-foot"><button type="button" class="btn" id="edCancelar">Cancelar</button><button type="submit" class="btn btn-p" id="edGuardar">Guardar</button></div>
  </form>
</div>

<script src="config.js"></script>
<script>
var S = { cfg: null, edit: null, archivos: {} };
function $(s) { return document.querySelector(s); }
function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, err) { var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 3500); }

/* ===== Conexión con Apps Script ===== */
var TOKEN = '', CLIENT_ID = '';
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var nombre = fn.replace(/^admin/, ''); nombre = nombre.charAt(0).toLowerCase() + nombre.slice(1);
  return fetch(CMIA_API, { method: 'POST', body: JSON.stringify({ accion: 'admin', token: TOKEN, fn: nombre, args: args }) })
    .then(function (r) { return r.json(); }, function () { throw new Error('No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.'); })
    .then(function (res) {
      if (res && res.ok) return res.data;
      var m = (res && res.error) || 'Error desconocido.';
      if (/sesión|no autorizado|venció/i.test(m)) bloquear(m);
      throw new Error(m);
    });
}

/* ===== Iniciar sesión con Google ===== */
function leerToken(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; } }
function bloquear(m) {
  TOKEN = ''; try { sessionStorage.removeItem('cmia-token'); } catch (e) { }
  $('#vApp').classList.add('hidden'); $('#vLogin').classList.remove('hidden');
  $('#loginMsg').textContent = m; $('#loginMsg').style.color = 'var(--bad)';
}
function conToken(t) {
  var p = leerToken(t);
  if (!p || p.exp * 1000 < Date.now() + 60000) return false;
  TOKEN = t; try { sessionStorage.setItem('cmia-token', t); } catch (e) { }
  $('#loginMsg').style.color = ''; $('#loginMsg').textContent = 'Verificando el acceso de ' + p.email + '…';
  run('adminIniciar').then(function (cfg) {
    S.cfg = cfg;
    try { localStorage.setItem('cmia-admin', '1'); } catch (e) { } // este navegador no suma lecturas ni descargas
    $('#cuenta').textContent = cfg.cuenta;
    $('#vLogin').classList.add('hidden'); $('#vApp').classList.remove('hidden');
    vRevista();
    clearTimeout(window._venc);
    window._venc = setTimeout(function () { bloquear('Tu sesión venció. Vuelve a iniciar sesión para seguir.'); }, p.exp * 1000 - Date.now() - 30000);
  }).catch(function (e) { bloquear(e.message); });
  return true;
}
function iniciarGoogle() {
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(iniciarGoogle, 200); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: function (r) { conToken(r.credential); }, auto_select: true, cancel_on_tap_outside: false, ux_mode: 'popup' });
  google.accounts.id.renderButton($('#gBtn'), { theme: 'outline', size: 'large', shape: 'rectangular', text: 'signin_with', locale: 'es', width: 300 });
  var guardado = ''; try { guardado = sessionStorage.getItem('cmia-token') || ''; } catch (e) { }
  if (!(guardado && conToken(guardado))) google.accounts.id.prompt();
}
function arrancar() {
  if (!window.CMIA_API || /PEGAR/.test(CMIA_API)) { $('#loginMsg').textContent = 'Falta configurar la dirección de Apps Script en config.js.'; return; }
  fetch(CMIA_API + '?api=config').then(function (r) { return r.json(); }).then(function (c) {
    CLIENT_ID = c.clientId || '';
    if (!CLIENT_ID) { $('#loginMsg').textContent = 'Falta GOOGLE_CLIENT_ID en las propiedades del proyecto de Apps Script.'; return; }
    iniciarGoogle();
  }).catch(function () { $('#loginMsg').textContent = 'No hay conexión con el servidor de la revista.'; });
}
$('#salir').onclick = function () {
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  TOKEN = ''; try { sessionStorage.removeItem('cmia-token'); } catch (e) { }
  $('#vApp').classList.add('hidden'); $('#vLogin').classList.remove('hidden');
  $('#loginMsg').style.color = ''; $('#loginMsg').textContent = 'Cerraste la sesión.';
};

/* ===== Editor lateral ===== */
function bloqueImagen(k, titulo, ayuda, url, ratio, w, h) {
  return '<div class="upload"><div class="upload-top"><div><b>' + titulo + '</b><div class="hint">' + ayuda + '</div></div>' +
    '<span class="picker btn btn-sm">Elegir imagen<input type="file" accept="image/jpeg,image/png,image/webp" data-img="' + k + '" data-w="' + w + '" data-h="' + h + '"></span></div>' +
    '<div class="preview" id="prev-' + k + '" style="aspect-ratio:' + ratio + '">' + (url ? '<img src="' + esc(url) + '" alt="Imagen actual">' : 'Sin imagen') + '</div>' +
    (url ? '<div><button type="button" class="btn btn-d btn-sm" data-quitar="' + k + '">Quitar imagen</button></div>' : '') + '</div>';
}
function cerrarEditor() { $('#editor').classList.add('hidden'); S.edit = null; S.archivos = {}; }
$('#edCerrar').onclick = cerrarEditor; $('#edCancelar').onclick = cerrarEditor;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.edit) cerrarEditor(); });
$('#edForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var d = { id: S.edit.id };
  new FormData(this).forEach(function (v, k) { d[k] = v; });
  guardarRevista(d);
});
/* Compresión de imágenes en el navegador */
function leerBase64(file) {
  return new Promise(function (ok, ko) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1]); }; r.onerror = ko; r.readAsDataURL(file); });
}
function comprimir(file, maxW, maxH) {
  return new Promise(function (ok, ko) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var f = Math.min(1, maxW / img.width, maxH / img.height);
      if (img.width < img.height && maxW > maxH) f = Math.min(1, maxH / img.width, maxW / img.height);
      var w = Math.round(img.width * f), h = Math.round(img.height * f);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d');
      var png = file.type === 'image/png';
      if (!png) { cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, w, h); }
      cx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      var mime = png ? 'image/png' : 'image/jpeg', q = 0.86, data = cv.toDataURL(mime, q);
      if (png && data.length * 0.75 > 600 * 1024) { mime = 'image/jpeg'; cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, w, h); data = cv.toDataURL(mime, q); }
      while (mime === 'image/jpeg' && data.length * 0.75 > 300 * 1024 && q > 0.5) { q -= 0.06; data = cv.toDataURL(mime, q); }
      var nombre = file.name.replace(/\.[^.]+$/, '') + (mime === 'image/png' ? '.png' : '.jpg');
      ok({ nombre: nombre, mime: mime, base64: data.split(',')[1], w: w, h: h });
    };
    img.onerror = function () { ko(new Error('El archivo no es una imagen válida.')); };
    img.src = url;
  });
}


/* ===== Revista CMIA ===== */
var RV = { sub: 'envios', datos: null, filtroNum: '' };
function vRevista() {
  run('adminRevista').then(function (r) { RV.datos = r; pintarRevista(); }).catch(function (e) { toast(e.message, true); });
}
function rvNum(id) { return (RV.datos.numeros || []).filter(function (n) { return n.id === id; })[0]; }
function rvNumTxt(n) { return n ? 'Vol. ' + n.volumen + ', Núm. ' + n.numero + ' (' + n.anio + ')' : 'Sin número'; }
function rvAutores(l) { return (l || []).map(function (x) { return (x.nombres || '') + ' ' + (x.apellidos || ''); }).join(', '); }
function pintarRevista() {
  var R = RV.datos, s = RV.sub;
  var nuevos = (R.envios || []).filter(function (e) { return e.estado === 'Recibido'; }).length;
  var subs = [['envios', 'Envíos' + (nuevos ? ' (' + nuevos + ')' : '')], ['numeros', 'Números'], ['articulos', 'Artículos'], ['evaluadores', 'Evaluadores'], ['equipo', 'Equipo editorial'], ['paginas', 'Políticas'], ['ajustes', 'Datos de la revista']];
  var tit = { envios: 'Envíos de manuscritos', evaluadores: 'Evaluadores', numeros: 'Números', articulos: 'Artículos', equipo: 'Equipo editorial', paginas: 'Políticas', ajustes: 'Datos de la revista' }[s];
  var h = '<div class="head"><div><h2>' + tit + '</h2><p class="sub">' + esc(R.nombre) + ' (' + R.sigla + ')</p></div></div>';
  if (!R.instalada) h += '<div class="empty" style="text-align:left;color:var(--bad)"><b>Falta instalar la revista.</b> Abre Codigo.gs en Apps Script y ejecuta una vez la función instalar. Crea la planilla, las carpetas de Drive, los textos base de las políticas y el equipo inicial.</div>';
  $('#tabs').innerHTML = subs.map(function (x) { return '<button type="button" data-rs="' + x[0] + '" aria-pressed="' + (s === x[0]) + '">' + x[1] + '</button>'; }).join('');
  if (s === 'numeros') {
    h += '<div style="margin:6px 0 14px"><button class="btn btn-p" id="rvNuevoNum">Nuevo número</button></div>' +
      (R.numeros.length ? '<div class="list">' + R.numeros.map(function (n) {
        var cant = R.articulos.filter(function (a) { return a.numeroId === n.id; }).length;
        return '<div class="row">' + (n.portadaUrl ? '<img class="thumb" src="' + esc(n.portadaUrl) + '" alt="" style="width:46px;height:64px;object-fit:cover">' : '<div class="thumb" style="width:46px;height:64px;background:#0F2E57;color:#C9A227;font-size:11px">CMIA</div>') +
          '<div class="row-main"><div class="row-title">' + rvNumTxt(n) + (n.titulo ? ' · ' + esc(n.titulo) : '') + '</div><div class="row-meta"><span>' + esc(n.periodo || '') + '</span>' +
          (n.estado === 'publicado' ? '<span class="et ok">Publicado ' + esc(n.fecha || '') + '</span>' : '<span class="et">En preparación</span>') +
          '<span class="et">' + cant + (cant === 1 ? ' artículo' : ' artículos') + '</span></div></div>' +
          '<div class="row-actions"><button class="btn btn-sm" data-rvart="' + n.id + '">Ver artículos</button><button class="btn btn-sm" data-rved="' + n.id + '">Editar</button>' +
          (n.estado !== 'publicado' ? '<button class="btn btn-d btn-sm" data-rvdel="' + n.id + '">Eliminar</button>' : '') + '</div></div>';
      }).join('') + '</div>' : '<div class="empty">Todavía no hay números. Crea el Vol. 1, Núm. 1 y después carga sus artículos.</div>');
  } else if (s === 'articulos') {
    var f = RV.filtroNum, lista = R.articulos.filter(function (a) { return !f || a.numeroId === f; }).sort(function (a, b) { return (Number(a.orden) || 0) - (Number(b.orden) || 0); });
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px"><button class="btn btn-p" id="rvNuevoArt">Nuevo artículo</button>' +
      '<select id="rvFiltro" style="height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px"><option value="">Todos los números</option>' +
      R.numeros.map(function (n) { return '<option value="' + n.id + '"' + (f === n.id ? ' selected' : '') + '>' + rvNumTxt(n) + '</option>'; }).join('') + '</select></div>' +
      (lista.length ? '<div class="list">' + lista.map(function (a) {
        var n = rvNum(a.numeroId);
        return '<div class="row"><div class="row-main"><div class="row-title">' + esc(a.titulo) + '</div><div class="row-meta">' +

    '<label class="field">Texto completo en HTML (opcional)<textarea name="texto" style="min-height:220px;font-family:\'IBM Plex Serif\',Georgia,serif">' + esc(a.texto) + '</textarea><span class="hint">Para el segundo formato que pide Latindex. Pega el texto del artículo: línea en blanco entre párrafos y subtítulos con <b>## Título</b>.</span></label>' +
    '<label class="field">Referencias<textarea name="referencias" style="min-height:140px">' + esc(a.referencias) + '</textarea><span class="hint">Una por párrafo, en APA 7.</span></label>' +
    '<div class="estado"><div class="estado-t">Estado</div><div class="estado-op">' + [['listo', 'Listo'], ['borrador', 'Borrador']].map(function (o) { return '<label><input type="radio" name="estado" value="' + o[0] + '"' + ((a.estado || 'listo') === o[0] ? ' checked' : '') + '>' + o[1] + '</label>'; }).join('') + '</div>' +
    '<span class="hint">Un artículo «Listo» se publica cuando su número está publicado. En borrador no se ve en el sitio.</span></div>');
  $('#auMas').onclick = function () { $('#auLista').insertAdjacentHTML('beforeend', filaAutor()); enlazarAutores(); };
  enlazarAutores();
  ['rvRes', 'rvAbs'].forEach(function (id) { var t = $('#' + id), f = function () { var n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; $('#' + id + 'N').textContent = n + ' palabras (se recomiendan entre 150 y 250).'; }; t.oninput = f; f(); });
}
function abrirEquipo(e) {
  e = e || {}; var R = RV.datos;
  rvAbrir('r_equipo', e.id, e.id ? 'Editar' : 'Agregar al equipo editorial',
    '<label class="field">Nombre completo<input name="nombre" required value="' + esc(e.nombre) + '"></label>' +
    '<div class="grid2"><label class="field">Rol' + rvSel('rol', R.roles, e.rol || 'Comité científico') + '</label><label class="field">Orden<input type="number" name="orden" value="' + esc(e.orden || '') + '" placeholder="1"></label></div>' +
    '<label class="field">Institución<input name="institucion" value="' + esc(e.institucion) + '" placeholder="Nombre completo de la universidad o institución"></label>' +
    '<div class="grid2"><label class="field">País<input name="pais" value="' + esc(e.pais) + '"></label><label class="field">ORCID<input name="orcid" value="' + esc(e.orcid) + '" placeholder="0000-0000-0000-0000"></label></div>' +
    '<label class="field">Correo (no se publica)<input type="email" name="correo" value="' + esc(e.correo) + '"></label>');
}
/* ===== Envíos y arbitraje ===== */
var DEC_TEXTO = {
  'Aceptado': 'Nos complace informarle que su manuscrito fue aceptado para publicación en la revista. En los próximos días le escribiremos para la edición final y la revisión de pruebas.',
  'Requiere cambios menores': 'Los evaluadores valoran el trabajo y recomiendan su publicación una vez atendidas algunas observaciones menores. Le pedimos revisar los comentarios que siguen y enviar la versión corregida dentro de 15 días.',
  'Requiere cambios mayores': 'Los evaluadores reconocen el interés del trabajo, pero señalan observaciones de fondo que deben resolverse antes de considerar su publicación. Le pedimos revisar los comentarios que siguen y enviar la versión corregida dentro de 30 días. La nueva versión volverá a evaluación.',
  'Rechazado': 'Lamentamos informarle que, tras la revisión, su manuscrito no fue aceptado para publicación en la revista. Le compartimos los comentarios recibidos, con la esperanza de que le sean útiles para continuar el trabajo.'
};
function evDeEnvio(cod) { return (RV.datos.evaluaciones || []).filter(function (v) { return v.codigo === cod; }); }
function refrescarEnvio(cod, msg, err) {
  return run('adminRevista').then(function (r) {
    RV.datos = r; pintarRevista();
    var e = (r.envios || []).filter(function (x) { return x.codigo === cod; })[0];
    if (e) abrirEnvio(e);
    if (msg) toast(msg, err);
  });
}
function accionEnvio(boton, fn, args, cod, ok) {
  boton.disabled = true;
  run(fn, args).then(function (r) { return refrescarEnvio(cod, (r && r._aviso) || ok, !!(r && r._aviso)); })
    .catch(function (er) { toast(er.message, true); boton.disabled = false; });
}
function abrirEnvio(e) {
  var R = RV.datos, f = function (k, v) { return v ? '<div style="margin-bottom:10px"><div class="hint">' + k + '</div><div style="white-space:pre-wrap">' + esc(v) + '</div></div>' : ''; };
  var evs = evDeEnvio(e.codigo), ronda = Number(e.ronda) || 1, final = ['Aceptado', 'Rechazado', 'Retirado'].indexOf(e.estado) > -1;
  var rondas = []; for (var i = ronda; i >= 1; i--) rondas.push(i);
  var asignados = evs.filter(function (v) { return Number(v.ronda) === ronda && ['Declinó', 'Cancelada'].indexOf(v.estado) < 0; }).map(function (v) { return v.evaluadorId; });
  var previos = evs.filter(function (v) { return Number(v.ronda) === ronda - 1 && v.estado === 'Entregado' && asignados.indexOf(v.evaluadorId) < 0; });
  var disp = (R.evaluadores || []).filter(function (x) { return x.activo !== 'NO' && asignados.indexOf(x.id) < 0; });
  var tablaEv = rondas.map(function (rd) {
    var l = evs.filter(function (v) { return Number(v.ronda) === rd; });
    return '<div class="hint" style="margin:10px 0 4px">Ronda ' + rd + '</div>' + (l.length ? l.map(function (v) {
      var cls = v.estado === 'Entregado' ? ' ok' : (['Declinó', 'Cancelada'].indexOf(v.estado) > -1 ? '' : ' alerta');
      return '<div class="row" style="padding:8px 0"><div class="row-main"><div><b>' + esc(v.nombre) + '</b></div><div class="row-meta"><span class="et' + cls + '">' + esc(v.estado) + '</span>' +
        (v.estado === 'Aceptó' || v.estado === 'Invitado' ? '<span>Plazo ' + esc(v.plazo) + '</span>' : '') + (v.dictamen ? '<span>' + esc(v.dictamen) + '</span>' : '') + (v.motivo ? '<span>Motivo: ' + esc(v.motivo) + '</span>' : '') + '</div></div>' +
        '<div class="row-actions">' + (v.estado === 'Entregado' ? '<button type="button" class="btn btn-sm" data-evver="' + v.id + '">Ver dictamen</button>' : '') +
        (v.estado === 'Invitado' || v.estado === 'Aceptó' ? '<button type="button" class="btn btn-sm" data-evrec="' + v.id + '">Recordar</button>' : '') +
        (v.estado === 'Aceptó' ? '<button type="button" class="btn btn-sm" data-evpla="' + v.id + '">+7 días</button>' : '') +
        (v.estado === 'Invitado' || v.estado === 'Aceptó' ? '<button type="button" class="btn btn-d btn-sm" data-evcan="' + v.id + '">Cancelar</button>' : '') + '</div></div>';
    }).join('') : '<div class="hint">Sin evaluadores asignados.</div>');
  }).join('');
  var vers = (e.versiones || []).map(function (v) {
    return '<li>Ronda ' + v.ronda + ' · ' + esc(v.fecha) + ' · <a href="' + esc(v.manuscritoUrl) + '" target="_blank" rel="noopener">manuscrito</a>' + (v.respuestaUrl ? ' · <a href="' + esc(v.respuestaUrl) + '" target="_blank" rel="noopener">respuesta a los evaluadores</a>' : '') + '</li>';
  }).join('');
  var html = '<div class="row-title" style="margin-bottom:6px">' + esc(e.titulo) + '</div><p class="row-meta" style="margin:0 0 14px"><span class="et">' + esc(e.estado) + '</span><span>Ronda ' + ronda + '</span><span>Recibido ' + esc(e.fecha) + '</span></p>' +
    f('Autor de correspondencia', e.nombre + ' · ' + e.correo) + f('Institución', e.institucion + ', ' + e.pais) + f('ORCID', e.orcid) + f('Coautores', e.coautores) +
    f('Área y tipo', e.area + ' · ' + e.tipo) + f('Resumen', e.resumen) + f('Comentarios del autor', e.comentarios) +
    '<div class="hint">Archivos</div><ul style="margin:4px 0 10px;padding-left:18px">' + vers + '<li><a href="' + esc(e.cartaUrl) + '" target="_blank" rel="noopener">Carta de presentación</a></li></ul>' +
    '<p><a href="mailto:' + esc(e.correo) + '?subject=' + encodeURIComponent(e.codigo + ': ' + e.titulo) + '">Escribir al autor</a></p>' +
    '<div class="agenda"><h3>Evaluación por pares</h3></div>' + tablaEv +
    (final ? '' : '<div class="grid2" style="margin-top:14px;align-items:end"><label class="field" style="margin:0">Asignar evaluador<select id="evSel"><option value="">Elige un evaluador</option>' +
      disp.map(function (x) { return '<option value="' + x.id + '">' + esc(x.nombre) + (x.areas ? ' · ' + esc(x.areas) : '') + (x.institucion ? ' (' + esc(x.institucion) + ')' : '') + '</option>'; }).join('') + '</select></label>' +
      '<div style="display:flex;gap:8px;align-items:end"><label class="field" style="margin:0;width:90px">Días<input id="evDias" type="number" min="5" max="60" value="21"></label><button type="button" class="btn btn-p" id="evAsignar">Enviar invitación</button></div></div>' +
      '<p class="hint" style="margin-top:6px">' + (disp.length ? 'Se le envía un correo con un enlace privado; no necesita cuenta.' : 'Agrega evaluadores en la pestaña Evaluadores.') + '</p>' +
      (previos.length ? '<p><button type="button" class="btn btn-sm" id="evPrevios">Enviar la ronda ' + ronda + ' a los evaluadores anteriores (' + previos.map(function (v) { return esc(v.nombre); }).join(', ') + ')</button></p>' : '')) +
    (final ? '' : '<div class="agenda"><h3>Decisión editorial</h3></div><label class="field" style="margin-top:12px">Decisión' + rvSel('decisionSel', [''].concat(R.decisiones), '') + '</label>' +
      '<label class="field">Mensaje para el autor<textarea id="decMsg" style="min-height:130px" placeholder="Elige una decisión para cargar un texto base"></textarea><span class="hint">Se envía por correo junto con los comentarios de los evaluadores de la ronda actual, sin sus nombres.</span></label>' +
      '<label class="field" style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="decCom" checked style="width:auto;margin:0">Incluir los comentarios de los evaluadores</label>' +
      '<p><button type="button" class="btn btn-p" id="decEnviar">Enviar la decisión al autor</button></p>') +
    (e.estado === 'Aceptado' ? '<div class="agenda"><h3>Publicación</h3></div>' + (e.articuloId ? '<p>El artículo ya está creado. Complétalo en la pestaña Artículos (título en inglés, palabras clave, páginas y PDF).</p>' :
      '<div style="display:flex;gap:8px;align-items:end;margin-top:12px"><label class="field" style="margin:0;flex:1">Número' + rvSel('numSel', (R.numeros || []).map(function (n) { return [n.id, rvNumTxt(n)]; }), (R.numeros[0] || {}).id) + '</label><button type="button" class="btn btn-p" id="artCrear">Crear el artículo</button></div>' +
      '<p class="hint">Se crea como borrador con el título, resumen, autores y fechas de recepción y aceptación.</p>') : '') +
    '<div class="agenda"><h3>Seguimiento interno</h3></div><label class="field" style="margin-top:12px">Estado' + rvSel('estado', R.estadosEnvio, e.estado) + '</label>' +
    '<label class="field">Notas internas (no las ve el autor)<textarea name="notas">' + esc(e.notas) + '</textarea></label>';
  rvAbrir('r_envio', e.codigo, e.codigo, html);
  var cod = e.codigo;
  $$('[data-evver]').forEach(function (b) { b.onclick = function () { verDictamen(evs.filter(function (v) { return v.id === b.getAttribute('data-evver'); })[0], e); }; });
  $$('[data-evrec]').forEach(function (b) { b.onclick = function () { accionEnvio(b, 'adminRevistaEvaluacion', { id: b.getAttribute('data-evrec'), accion: 'recordar' }, cod, 'Recordatorio enviado.'); }; });
  $$('[data-evpla]').forEach(function (b) { b.onclick = function () { accionEnvio(b, 'adminRevistaEvaluacion', { id: b.getAttribute('data-evpla'), accion: 'plazo', dias: 7 }, cod, 'Plazo ampliado en 7 días y aviso enviado.'); }; });
  $$('[data-evcan]').forEach(function (b) { b.onclick = function () { if (confirm('¿Cancelar esta evaluación? Se le avisará al evaluador.')) accionEnvio(b, 'adminRevistaEvaluacion', { id: b.getAttribute('data-evcan'), accion: 'cancelar' }, cod, 'Evaluación cancelada.'); }; });
  if ($('#evAsignar')) $('#evAsignar').onclick = function () { var id = $('#evSel').value; if (!id) { toast('Elige un evaluador.', true); return; } accionEnvio(this, 'adminRevistaAsignar', { codigo: cod, evaluadorId: id, dias: $('#evDias').value }, cod, 'Invitación enviada.'); };
  if ($('#evPrevios')) $('#evPrevios').onclick = function () {
    var b = this; b.disabled = true;
    previos.reduce(function (p, v) { return p.then(function () { return run('adminRevistaAsignar', { codigo: cod, evaluadorId: v.evaluadorId, dias: 15 }); }); }, Promise.resolve())
      .then(function () { return refrescarEnvio(cod, 'Invitaciones enviadas.'); }).catch(function (er) { toast(er.message, true); b.disabled = false; });
  };
  var ds = $('#edBody [name=decisionSel]');
  if (ds) ds.onchange = function () { if (DEC_TEXTO[this.value]) $('#decMsg').value = DEC_TEXTO[this.value]; };
  if ($('#decEnviar')) $('#decEnviar').onclick = function () {
    var dec = ds.value; if (!dec) { toast('Elige una decisión.', true); return; }
    if (!confirm('¿Enviar al autor la decisión «' + dec + '»?')) return;
    accionEnvio(this, 'adminRevistaDecidir', { codigo: cod, decision: dec, mensaje: $('#decMsg').value, incluirComentarios: $('#decCom').checked }, cod, 'Decisión enviada al autor.');
  };
  if ($('#artCrear')) $('#artCrear').onclick = function () { accionEnvio(this, 'adminRevistaCrearArticulo', { codigo: cod, numeroId: $('#edBody [name=numSel]').value }, cod, 'Artículo creado como borrador en la pestaña Artículos.'); };
}
function verDictamen(v, e) {
  var R = RV.datos, c = v.criterios || {};
  var html = '<p><button type="button" class="btn btn-sm" id="evVolver">Volver al envío</button></p>' +
    '<div class="row-title">' + esc(v.nombre) + '</div><p class="row-meta" style="margin:4px 0 14px"><span>Ronda ' + v.ronda + '</span><span>Entregado ' + esc(v.entregado) + '</span><span class="et ok">' + esc(v.dictamen) + '</span></p>' +
    '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px">' + (R.criterios || []).map(function (k) {
      return '<tr style="border-bottom:1px solid var(--linea)"><td style="padding:6px 0">' + esc(k[1]) + '</td><td style="text-align:right;font-weight:600">' + (c[k[0]] || '') + ' / 5</td></tr>'; }).join('') + '</table>' +
    '<div class="hint">Comentarios para los autores</div><div style="white-space:pre-wrap;margin-bottom:14px">' + esc(v.paraAutor) + '</div>' +
    (v.paraEditor ? '<div class="hint">Comentarios confidenciales para el equipo editorial</div><div style="white-space:pre-wrap;margin-bottom:14px">' + esc(v.paraEditor) + '</div>' : '') +
    (v.archivoUrl ? '<p><a href="' + esc(v.archivoUrl) + '" target="_blank" rel="noopener">Abrir el archivo con observaciones</a></p>' : '');
  rvAbrir('r_envio', e.codigo, e.codigo + ' · dictamen', html);
  $('#evVolver').onclick = function () { abrirEnvio(e); };
}
function abrirEvaluador(x) {
  x = x || {};
  rvAbrir('r_evaluador', x.id, x.id ? 'Editar evaluador' : 'Nuevo evaluador',
    '<label class="field">Nombre completo<input name="nombre" required value="' + esc(x.nombre) + '"></label>' +
    '<label class="field">Correo<input type="email" name="correo" required value="' + esc(x.correo) + '"></label>' +
    '<label class="field">Institución<input name="institucion" value="' + esc(x.institucion) + '"></label>' +
    '<div class="grid2"><label class="field">País<input name="pais" value="' + esc(x.pais) + '"></label><label class="field">ORCID<input name="orcid" value="' + esc(x.orcid) + '" placeholder="0000-0000-0000-0000"></label></div>' +
    '<label class="field">Áreas de especialidad<input name="areas" value="' + esc(x.areas) + '" placeholder="Marketing, métodos cuantitativos"></label>' +
    '<label class="field">Disponible' + rvSel('activo', [['SI', 'Sí'], ['NO', 'No, por ahora']], x.activo || 'SI') + '</label>' +
    '<p class="hint">El evaluador no necesita cuenta: recibe un enlace privado por cada manuscrito. Sus datos no se publican.</p>');
}
function abrirPaginaRv(p) {
  rvAbrir('r_pagina', p.clave, 'Editar: ' + p.titulo,
    '<label class="field">Título<input name="titulo" value="' + esc(p.titulo) + '"></label>' +
    '<label class="field">Texto<textarea name="texto" style="min-height:420px;font-family:\'IBM Plex Serif\',Georgia,serif;font-size:16px;line-height:1.6">' + esc(p.texto) + '</textarea><span class="hint">Línea en blanco entre párrafos. Subtítulo: <b>## Texto</b>. Negrita: <b>**texto**</b>.</span></label>');
}
function guardarRevista(d) {
  var t = S.edit.tipo, A = S.archivos, fn = { r_numero: 'adminRevistaGuardarNumero', r_articulo: 'adminRevistaGuardarArticulo', r_equipo: 'adminRevistaGuardarEquipo', r_pagina: 'adminRevistaGuardarPagina', r_envio: 'adminRevistaGuardarEnvio', r_evaluador: 'adminRevistaGuardarEvaluador' }[t];
  if (t === 'r_envio') d.codigo = S.edit.id;
  if (t === 'r_pagina') d.clave = S.edit.id;
  if (t === 'r_articulo') {
    d.autores = $$('#auLista .au-fila').map(function (f) { var o = {}; Array.prototype.slice.call(f.querySelectorAll('[data-au]')).forEach(function (i) { o[i.getAttribute('data-au')] = i.value.trim(); }); return o; })
      .filter(function (o) { return o.nombres || o.apellidos; });
    if (!d.autores.length) { toast('Agrega al menos un autor con su nombre.', true); return; }
    var malo = d.autores.filter(function (o) { return o.orcid && !/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(o.orcid.replace(/^https?:\/\/orcid\.org\//, '')); })[0];
    if (malo) { toast('El ORCID de ' + (malo.nombres || malo.apellidos) + ' no tiene el formato 0000-0000-0000-0000.', true); return; }
    var sinMail = d.autores.filter(function (o) { return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.correo || ''); })[0];
    if (sinMail) { toast('Falta el correo de ' + ((sinMail.nombres || '') + ' ' + (sinMail.apellidos || '')).trim() + '. Todos los autores reciben su certificado de publicación.', true); return; }
    d.exigirCorreos = true;
  }
  if (A.portada) d.portadaNueva = A.portada; if (A.quitar_portada) d.quitarPortada = true;
  if (A.pdf) d.pdfNuevo = A.pdf; if (A.quitar_pdf) d.quitarPdf = true;
  var btn = $('#edGuardar'); btn.disabled = true; btn.textContent = (A.pdf || A.portada) ? 'Subiendo archivos…' : 'Guardando…';
  run(fn, d).then(function (r) { cerrarEditor(); toast(r && r._aviso ? r._aviso : 'Guardado.', !!(r && r._aviso)); vRevista(); })
    .catch(function (e) { toast(e.message, true); }).then(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
}
